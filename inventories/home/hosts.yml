---
# 管理対象のRaspberry Pi一覧。
# 台数が増えたら hosts に追加し、用途ごとのグループに所属させる。
all:
  children:
    raspberry_pi:
      hosts:
        rpi-01:
          ansible_host: 192.168.10.55  # wlan0 の固定IP（host_vars の static_ip_interfaces）
        rpi-02:
          ansible_host: 192.168.10.16
    # SFTPGo で USB のディレクトリを LAN に公開する（roles/sftpgo。vault のパスワードが必要）
    sftpgo:
      hosts:
        rpi-01:
    # Mirakurun + EPGStation で録画する（roles/epgstation。チューナー・カードリーダーと vault のパスワードが必要）
    epgstation:
      hosts:
        rpi-01:
    # Plex Media Server で /mnt/data/encoded を LAN に配信する（roles/plex。初回はブラウザでアカウントに登録する）
    plex:
      hosts:
        rpi-01:
    # Grafana Alloy でメトリクスを Grafana Cloud に送る（roles/alloy。vault の Grafana Cloud のトークンが必要）
    monitoring:
      hosts:
        rpi-01:
