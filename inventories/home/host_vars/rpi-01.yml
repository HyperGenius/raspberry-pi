---
# rpi-01 固有の変数
hostname: raspberrypi

# 固定IP（roles/static_ip）。wlan0 のアドレスを変えたら hosts.yml の ansible_host も合わせる
static_ip_interfaces:
  - ifname: wlan0
    address: 192.168.10.55/24
    gateway: 192.168.10.1
    dns:
      - 192.168.10.1

# USB ストレージ（roles/usb_storage）。既存のデータをそのまま使う（mkfs・chown はしない）
usb_storage_devices:
  - uuid: 96efbf0e-c2e7-4007-b81d-1177c5f73fdc  # sda1
    fstype: ext4
    path: /mnt/data
  - uuid: a6c04fd5-09d5-4bb7-9d6b-b856611129da  # sdb1（#32 で NTFS から ext4 にフォーマットし直した）
    fstype: ext4
    path: /mnt/share

# SFTPGo（roles/sftpgo）。/mnt/data/recorded・/mnt/data/encoded・/mnt/share を LAN に公開する。パスワードのハッシュは vault に置く
sftpgo_allowed_networks:
  - 192.168.10.0/24
sftpgo_folders:
  recorded: /mnt/data/recorded
  data: /mnt/data/encoded
  share: /mnt/share
sftpgo_users:
  # エンコード用 PC。録画データ（/recorded）を取得して削除し（移動）、エンコードしたファイルを /encoded に追加する。
  # 録画中のファイルは PC 側で EPGStation の API を見て除外する（SFTPGo からは区別できない）
  - name: encoder
    password_hash: "{{ vault_sftpgo_encoder_password_hash }}"
    root: empty
    permissions:
      /: [list]
      /recorded: [list, download, delete]
      /encoded: [list, upload, create_dirs]
    virtual_folders:
      /recorded: recorded
      /encoded: data
  # 人が使う。/ には data（/mnt/data/encoded。読み取りのみ）と share（/mnt/share。全権限）だけを表示する
  - name: genius
    password_hash: "{{ vault_sftpgo_genius_password_hash }}"
    root: empty
    permissions:
      /: [list]
      /data: [list, download]
      /share: ["*"]
    virtual_folders:
      /data: data
      /share: share
