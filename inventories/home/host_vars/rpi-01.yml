---
# rpi-01 固有の変数
hostname: raspberrypi

# 固定IP（roles/static_ip）。wlan0 のアドレスを変えたら hosts.yml の ansible_host も合わせる
static_ip_interfaces:
  - ifname: wlan0
    address: 192.168.10.55/24
    gateway: 192.168.10.1
    dns:
      - 192.168.10.1

# USB ストレージ（roles/usb_storage）。既存のデータをそのまま使う（mkfs・chown はしない）
usb_storage_devices:
  - uuid: 96efbf0e-c2e7-4007-b81d-1177c5f73fdc  # sda1
    fstype: ext4
    path: /mnt/data
  - uuid: a6c04fd5-09d5-4bb7-9d6b-b856611129da  # sdb1（#32 で NTFS から ext4 にフォーマットし直した）
    fstype: ext4
    path: /mnt/share

# SFTPGo（roles/sftpgo）。/mnt/data/encoded を / に、/mnt/share を /share に公開する。パスワードのハッシュは vault に置く
sftpgo_allowed_networks:
  - 192.168.10.0/24
sftpgo_folders:
  share: /mnt/share
sftpgo_users:
  # スクリプト用。一覧・取得・アップロードのみ（上書き・削除・リネームは不可）
  - name: client
    password_hash: "{{ vault_sftpgo_client_password_hash }}"
    permissions:
      /: [list, download, upload, create_dirs]
  # 人が使う。/share（/mnt/share）は全権限、/（/mnt/data/encoded）は読み取りのみ
  - name: genius
    password_hash: "{{ vault_sftpgo_genius_password_hash }}"
    permissions:
      /: [list, download]
      /share: ["*"]
    virtual_folders:
      /share: share
