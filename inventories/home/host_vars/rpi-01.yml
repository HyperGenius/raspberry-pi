---
# rpi-01 固有の変数
hostname: raspberrypi

# 固定IP（roles/static_ip）。wlan0 のアドレスを変えたら hosts.yml の ansible_host も合わせる
static_ip_interfaces:
  - ifname: wlan0
    address: 192.168.10.55/24
    gateway: 192.168.10.1
    dns:
      - 192.168.10.1

# USB ストレージ（roles/usb_storage）。既存のデータをそのまま使う（mkfs・chown はしない）
usb_storage_devices:
  - uuid: 96efbf0e-c2e7-4007-b81d-1177c5f73fdc  # sda1
    fstype: ext4
    path: /mnt/data
  - uuid: 226667176666EACD  # sdb1。Docker の bind mount 先には使わない
    fstype: ntfs
    path: /mnt/share

# SFTPGo（roles/sftpgo）。/mnt/data/encoded を LAN に公開する。パスワードのハッシュは vault に置く
sftpgo_allowed_networks:
  - 192.168.10.0/24
sftpgo_users:
  # スクリプト用。一覧・取得・アップロードのみ（上書き・削除・リネームは不可）
  - name: client
    password_hash: "{{ vault_sftpgo_client_password_hash }}"
    permissions:
      /: [list, download, upload, create_dirs]
