---
# Imagerで書き込んだSDカードのbootfsを、初回起動前にMac上で準備する。
#   ansible-playbook playbooks/prepare_sd.yml -e target=rpi-01 --ask-vault-pass
- name: Prepare bootfs on Mac
  hosts: "{{ target }}"
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  # 秘密情報はこの Playbook だけで使う。group_vars に置くと全 Playbook の実行に vault のパスワードが必要になる
  vars_files:
    - "{{ inventory_dir }}/vault.yml"
  roles:
    - bootfs
