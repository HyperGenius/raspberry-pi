---
# 実行順序: 実行前チェック → apt リポジトリ → インストール → systemd の drop-in → daemon.json →（handler で反映）→ 検証
- name: Validate docker settings
  ansible.builtin.assert:
    that:
      - docker_log_max_size is match('^[0-9]+[kmg]$')
      - docker_log_max_file | int >= 1
    fail_msg: "docker_log_max_size は数字 + k / m / g（例: 10m）、docker_log_max_file は 1 以上にすること"
    quiet: true

# ---- 実行前チェック ----
# インストールすると dockerd が起動して /var/lib/docker に書き込むため、何も変更する前に確認する
- name: Find the device mounted on {{ docker_data_root }}
  ansible.builtin.command: findmnt -n -o SOURCE,FSTYPE --mountpoint {{ docker_data_root }}
  register: docker_data_mount
  changed_when: false
  failed_when: docker_data_mount.rc not in [0, 1]
  check_mode: false  # 読み取りのみ

- name: Fail unless p3 is mounted on {{ docker_data_root }}
  ansible.builtin.assert:
    that: docker_data_mount.stdout.split() == [docker_data_device, docker_data_fstype]
    fail_msg: >-
      {{ docker_data_root }} に {{ docker_data_device }}（{{ docker_data_fstype }}）がマウントされていない（{{ docker_data_mount.stdout | regex_replace('\s+', ' ') or 'マウントなし' }}）。
      先に sd_partition role（--tags sd_partition）を実行すること
    quiet: true

- name: Read the dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_dpkg_arch
  changed_when: false
  check_mode: false  # 読み取りのみ

# 32bit（armhf）の Raspberry Pi OS は Debian ではなく Raspbian のリポジトリになる（Docker 29 以降は非対応）
- name: Fail unless the OS is 64-bit Debian
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - docker_dpkg_arch.stdout in ['arm64', 'amd64']
    fail_msg: "64bit の Debian 系（Raspberry Pi OS 64bit）を前提にしている（{{ ansible_facts['distribution'] }} / {{ docker_dpkg_arch.stdout }}）"
    quiet: true

# ---- apt リポジトリ ----
- name: Download the Docker apt key
  ansible.builtin.get_url:
    url: "{{ docker_apt_repo_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  register: docker_apt_key

- name: Add the Docker apt repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
  register: docker_apt_repo

- name: Check whether Docker is installed
  ansible.builtin.command: dpkg-query -W -f ${Status} docker-ce
  register: docker_installed
  changed_when: false
  failed_when: false
  check_mode: false  # 読み取りのみ

# リポジトリを追加していない --check では apt がパッケージを見つけられず、以降のタスクも docker.service を必要とする
- name: Stop here in check mode if Docker would be installed
  when: >-
    ansible_check_mode and
    (docker_installed.stdout != 'install ok installed' or docker_apt_key is changed or docker_apt_repo is changed)
  block:
    - name: Show the planned changes
      ansible.builtin.debug:
        msg: "Docker をインストールする（{{ docker_packages | join(', ') }}）。drop-in・daemon.json・検証はインストール後に確認できる"

    - name: End the role (the following tasks need Docker)
      ansible.builtin.meta: end_role

# ---- インストール ----
- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
  when: docker_apt_key is changed or docker_apt_repo is changed

- name: Remove packages that conflict with Docker
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---- systemd の drop-in（起動時に p3 のマウントを待つ）----
- name: Create /etc/systemd/system/docker.service.d
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Make docker.service require the mount of {{ docker_data_root }}
  ansible.builtin.template:
    src: 10-mounts.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-mounts.conf
    mode: "0644"
  notify: Reload systemd

# ---- daemon.json ----
- name: Create /etc/docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
    validate: dockerd --validate --config-file %s
  register: docker_daemon_json
  notify: Restart docker

- name: Apply the changes before verifying
  ansible.builtin.meta: flush_handlers

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# ---- 検証 ----
# --check で daemon.json を変更する予定の場合は、まだ反映されていないので検証しない
- name: Verify the Docker data location
  when: not (ansible_check_mode and docker_daemon_json is changed)
  block:
    - name: Read docker info
      ansible.builtin.command: docker info --format json
      register: docker_info
      changed_when: false
      check_mode: false  # 読み取りのみ

    - name: Set the Docker root dir and storage driver
      ansible.builtin.set_fact:
        docker_root_dir: "{{ (docker_info.stdout | from_json).DockerRootDir }}"
        docker_storage_driver: "{{ (docker_info.stdout | from_json).Driver }}"

    - name: Find the device under {{ docker_root_dir }}
      ansible.builtin.command: findmnt -n -o SOURCE --target {{ docker_root_dir }}
      register: docker_root_source
      changed_when: false
      check_mode: false  # 読み取りのみ

    - name: Fail unless Docker stores its data on p3
      ansible.builtin.assert:
        that:
          - docker_root_dir == docker_data_root
          - docker_root_source.stdout == docker_data_device
          # containerd の image store（overlayfs）では、イメージが /var/lib/containerd に置かれる
          - docker_containerd_snapshotter | bool or docker_storage_driver == 'overlay2'
        fail_msg: >-
          Docker のデータが {{ docker_data_device }} に置かれていない
          （Docker Root Dir: {{ docker_root_dir }} on {{ docker_root_source.stdout }}, Storage Driver: {{ docker_storage_driver }}）
        quiet: true
