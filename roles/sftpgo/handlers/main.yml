---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# compose.yml・users.json の変更を反映する（docker compose down → up でコンテナを作り直す。接続中の転送は切れる）。
# --check で初めて導入する場合は、ユニットがまだないので何もしない
- name: Restart sftpgo
  ansible.builtin.systemd_service:
    name: sftpgo
    state: restarted
  when: not ansible_check_mode or sftpgo_unit_stat.stat.exists
